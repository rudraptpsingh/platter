name: Release

# Triggered by a version tag (v*) or manually via workflow_dispatch.
# Builds a universal macOS app, signs + notarizes if Apple secrets are present,
# attaches DMG + tarball to the GitHub release, and deploys latest.json to
# Cloudflare Pages so the in-app updater picks it up.
#
# Required GitHub Secrets:
#   ── Tauri updater signature (REQUIRED for in-app auto-update) ──
#   TAURI_SIGNING_PRIVATE_KEY            contents of ~/.tauri/platter-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   password protecting that key
#
#   ── Apple Developer ID (OPTIONAL — without these, an UNSIGNED dmg is built) ──
#   MAC_CERT_P12_BASE64           Developer ID Application cert .p12 → base64
#   MAC_CERT_P12_PASSWORD         password protecting that .p12
#   APPLE_ID                      Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD   from appleid.apple.com → app-specific passwords
#   APPLE_TEAM_ID                 10-char team id
#
#   ── Cloudflare Pages deploy of latest.json (REQUIRED for in-app auto-update reach) ──
#   CLOUDFLARE_API_TOKEN          token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID         hex account id
#
# Release checklist (run before tagging):
#   scripts/bump-version.sh <version>   — syncs package.json / tauri.conf.json / Cargo.toml
#   git tag v<version> && git push origin v<version>

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # attach DMG + latest.json to a GH release

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version sync
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          CARGO=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "package.json: $PKG  |  tauri.conf.json: $TAURI  |  Cargo.toml: $CARGO"
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version mismatch — run scripts/bump-version.sh <version> before tagging."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Detect Apple secrets
        id: apple
        run: |
          if [ -n "${{ secrets.MAC_CERT_P12_BASE64 }}" ] \
            && [ -n "${{ secrets.APPLE_ID }}" ] \
            && [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] \
            && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple Developer ID secrets present — building signed + notarized bundle."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple Developer ID secrets not configured — building UNSIGNED bundle. Gatekeeper will warn."
          fi

      - name: Decode Developer ID certificate
        if: steps.apple.outputs.available == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: echo "$MAC_CERT_P12_BASE64" | base64 --decode > /tmp/developer-id.p12

      - name: Import certificate + discover identity
        if: steps.apple.outputs.available == 'true'
        env:
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          [ ! -f "$KEYCHAIN" ] && KEYCHAIN="login-keychain"
          security import /tmp/developer-id.p12 -k "$KEYCHAIN" \
            -P "$MAC_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -A 2>/dev/null || true
          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
            | grep "Developer ID Application:" | head -1 \
            | sed -n 's/.*"\([^"]*\)".*/\1/p')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Could not discover Developer ID Application identity."
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install Apple intermediate CA certificates
        if: steps.apple.outputs.available == 'true'
        run: |
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          [ ! -f "$KEYCHAIN" ] && KEYCHAIN="login-keychain"
          for name in AppleWWDRCAG2 AppleWWDRCAG3 AppleWWDRCAG4 DeveloperIDCA DeveloperIDG2CA; do
            url="https://www.apple.com/certificateauthority/${name}.cer"
            if curl -sSLf --max-time 30 -o "/tmp/${name}.cer" "$url"; then
              security add-certificates -k "$KEYCHAIN" "/tmp/${name}.cer" 2>&1 || echo "  (already present)"
            fi
          done

      - name: Build (signed + notarized)
        if: steps.apple.outputs.available == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin

      - name: Build (unsigned — Apple secrets missing)
        if: steps.apple.outputs.available != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin

      - name: Verify signature + notarization
        if: steps.apple.outputs.available == 'true'
        run: |
          set -e
          for app in src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
            echo "=== $app ==="
            codesign -vvv --deep --strict "$app"
            spctl --assess --type execute --verbose "$app" 2>&1 || true
          done
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            echo "=== $dmg ==="
            xcrun stapler validate "$dmg" || echo "::warning::Stapler validation failed for $dmg"
          done

      - name: Cleanup certificate
        if: always() && steps.apple.outputs.available == 'true'
        run: rm -f /tmp/developer-id.p12

      - name: Build latest.json manifest
        id: manifest
        run: |
          set -e
          BUNDLE_DIR=src-tauri/target/universal-apple-darwin/release/bundle
          TARBALL=$(ls "$BUNDLE_DIR/macos"/*.app.tar.gz 2>/dev/null | head -1)
          SIG_FILE="${TARBALL}.sig"
          [ ! -f "$TARBALL" ] && echo "::error::no .app.tar.gz emitted" && exit 1
          [ ! -f "$SIG_FILE" ] && echo "::error::no .sig emitted (TAURI_SIGNING_PRIVATE_KEY not set?)" && exit 1
          SIG=$(cat "$SIG_FILE")
          VERSION=$(node -p "require('./package.json').version")
          REF_NAME="${GITHUB_REF_NAME:-v$VERSION}"
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${REF_NAME}/$(basename "$TARBALL")"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Pull release notes from docs/changelog.md if it exists, else use a link
          NOTES="See https://github.com/${{ github.repository }}/releases/tag/${REF_NAME}"
          if [ -f "docs/changelog.md" ]; then
            # Extract the section for this version (between first two ## headings)
            SECTION=$(awk "/^## v?${VERSION}/{found=1; next} found && /^## /{exit} found{print}" docs/changelog.md | head -10 | tr '\n' ' ' | sed 's/["\]/\\&/g')
            [ -n "$SECTION" ] && NOTES="$SECTION"
          fi

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "$NOTES",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": { "signature": "$SIG", "url": "$ASSET_URL" },
              "darwin-x86_64":  { "signature": "$SIG", "url": "$ASSET_URL" }
            }
          }
          EOF
          cp "$TARBALL" .
          cp "$SIG_FILE" .
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la latest.json *.app.tar.gz *.sig

      - name: Upload artifacts (workflow_dispatch fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: platter-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            latest.json
          retention-days: 14

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            latest.json
          generate_release_notes: true

      - name: Stage latest.json into landing/ for Cloudflare Pages
        run: |
          cp latest.json landing/latest.json
          ls -la landing/latest.json

      - name: Deploy landing + latest.json to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping Pages deploy. Auto-update endpoint will be stale."
            exit 0
          fi
          npx wrangler@4 pages deploy ./landing \
            --project-name=platter \
            --branch=main \
            --commit-dirty=true
          echo "✓ Deployed to https://platter.pages.dev — auto-updater endpoint live"
