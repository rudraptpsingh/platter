<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — Platter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #fafafa; color: #1d1d1f; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 20px; padding: 3rem 2.5rem;
          box-shadow: 0 4px 24px rgba(0,0,0,.08); width: 100%; max-width: 440px; }
  .step { font-size: .78rem; color: #aaa; font-weight: 500; letter-spacing: .08em;
          text-transform: uppercase; margin-bottom: 1rem; }
  h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.03em; margin-bottom: .6rem; }
  p  { font-size: .9375rem; color: #555; line-height: 1.6; margin-bottom: 2rem; }
  .input-group { margin-bottom: 1rem; }
  label { display: block; font-size: .82rem; font-weight: 500; margin-bottom: .4rem; color: #333; }
  input { width: 100%; padding: .75rem 1rem; border: 1.5px solid #e0e0e5; border-radius: 10px;
          font-size: .9375rem; outline: none; transition: border-color .15s; }
  input:focus { border-color: #0071e3; }
  .btn { width: 100%; padding: .875rem; background: #0071e3; color: #fff; border: none;
         border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
         margin-top: .5rem; transition: background .15s; }
  .btn:hover { background: #0064cc; }
  .dots { display: flex; gap: .4rem; justify-content: center; margin-top: 1.75rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #e0e0e5; }
  .dot.active { background: #0071e3; }
</style>
</head>
<body>
<div class="card">
  <div class="step">Step 1 of 3</div>
  <h1>Set up your workspace</h1>
  <p>Tell us a bit about yourself so we can tailor the experience to your workflow.</p>
  <div class="input-group">
    <label for="name">Your name</label>
    <input id="name" type="text" placeholder="Rp Singh">
  </div>
  <div class="input-group">
    <label for="role">Your role</label>
    <input id="role" type="text" placeholder="e.g. Product designer, engineer…">
  </div>
  <button class="btn">Continue →</button>
  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>
</body>
</html>
