<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap');

  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #14110D;
    font-family: ui-serif, 'New York', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #14110D;
  }

  /* Subtle radial glow */
  .canvas::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 700px 600px at 50% 45%, rgba(201,71,42,0.10) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Grain texture */
  .canvas::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    opacity: 0.5;
    pointer-events: none;
  }

  /* App window mock */
  .window {
    width: 760px;
    border-radius: 14px;
    background: #F4EFE5;
    box-shadow: 0 60px 120px rgba(0,0,0,0.7), 0 0 0 1px rgba(232,223,205,0.12);
    overflow: hidden;
    position: relative;
    z-index: 1;
    margin-bottom: 64px;
  }

  .window-bar {
    height: 38px;
    background: #ECE5D7;
    border-bottom: 1px solid rgba(27,23,20,0.10);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
  }

  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot-r { background: #FF5F57; }
  .dot-y { background: #FEBC2E; }
  .dot-g { background: #28C840; }

  .window-body {
    display: grid;
    grid-template-columns: 200px 1fr;
    height: 340px;
  }

  .sidebar {
    background: rgba(0,0,0,0.025);
    border-right: 1px solid rgba(27,23,20,0.10);
    padding: 16px 0;
  }

  .sidebar-item {
    padding: 6px 16px;
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: #4A4138;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-item.active {
    background: rgba(27,23,20,0.06);
    color: #1B1714;
    font-weight: 500;
  }

  .sidebar-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(27,23,20,0.15);
    flex-shrink: 0;
  }

  .sidebar-dot.ok { background: #6E7F58; }
  .sidebar-dot.warn { background: #C9472A; }

  .content {
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    align-content: start;
  }

  .card {
    border-radius: 8px;
    background: #ECE5D7;
    border: 1px solid rgba(27,23,20,0.08);
    overflow: hidden;
  }

  .card-thumb {
    height: 90px;
    background: linear-gradient(135deg, #DFD6C3 0%, #C8BFA8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, sans-serif;
    font-style: italic;
    font-size: 11px;
    color: rgba(27,23,20,0.3);
  }

  .card-thumb.approved { background: linear-gradient(135deg, rgba(110,127,88,0.15) 0%, rgba(110,127,88,0.08) 100%); }
  .card-thumb.rejected { background: linear-gradient(135deg, rgba(160,68,40,0.12) 0%, rgba(160,68,40,0.06) 100%); }

  .card-foot {
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-name {
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    color: #4A4138;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .verdict {
    font-family: -apple-system, sans-serif;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .verdict.approved { background: rgba(110,127,88,0.15); color: #5C6B4A; }
  .verdict.rejected { background: rgba(160,68,40,0.12); color: #A04428; }

  /* Wordmark + tagline */
  .brand {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .wordmark {
    font-family: ui-serif, 'New York', Georgia, serif;
    font-style: italic;
    font-size: 52px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: #E8DFCD;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 16px;
    justify-content: center;
  }

  .mark {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #C9472A 0%, #5A2E20 100%);
    border: 2px solid #E8DFCD;
    flex-shrink: 0;
  }

  .tagline {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(232,223,205,0.45);
  }

  /* Handle */
  .handle {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: rgba(232,223,205,0.30);
    z-index: 1;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="canvas">

  <div class="window">
    <div class="window-bar">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <div class="window-body">
      <div class="sidebar">
        <div class="sidebar-item" style="font-size:10px;color:#847866;letter-spacing:0.1em;text-transform:uppercase;padding-bottom:10px;">Recents</div>
        <div class="sidebar-item active">
          <div class="sidebar-dot"></div>
          landing-v3
        </div>
        <div class="sidebar-item">
          <div class="sidebar-dot ok"></div>
          onboarding
        </div>
        <div class="sidebar-item">
          <div class="sidebar-dot warn"></div>
          dashboard
        </div>
        <div class="sidebar-item">
          <div class="sidebar-dot"></div>
          mobile-nav
        </div>
        <div class="sidebar-item">
          <div class="sidebar-dot"></div>
          checkout
        </div>
      </div>
      <div class="content">
        <div class="card">
          <div class="card-thumb approved" style="font-size:13px;color:rgba(110,127,88,0.5);">✓</div>
          <div class="card-foot">
            <span class="card-name">hero-v2.html</span>
            <span class="verdict approved">approved</span>
          </div>
        </div>
        <div class="card">
          <div class="card-thumb rejected" style="font-size:13px;color:rgba(160,68,40,0.5);">✕</div>
          <div class="card-foot">
            <span class="card-name">pricing.html</span>
            <span class="verdict rejected">rejected</span>
          </div>
        </div>
        <div class="card">
          <div class="card-thumb" style="font-size:24px;color:rgba(27,23,20,0.12);">?</div>
          <div class="card-foot">
            <span class="card-name">features.html</span>
          </div>
        </div>
        <div class="card">
          <div class="card-thumb approved" style="font-size:13px;color:rgba(110,127,88,0.5);">✓</div>
          <div class="card-foot">
            <span class="card-name">nav-final.png</span>
            <span class="verdict approved">approved</span>
          </div>
        </div>
        <div class="card">
          <div class="card-thumb" style="font-size:24px;color:rgba(27,23,20,0.12);">?</div>
          <div class="card-foot">
            <span class="card-name">footer.html</span>
          </div>
        </div>
        <div class="card">
          <div class="card-thumb rejected" style="font-size:13px;color:rgba(160,68,40,0.5);">✕</div>
          <div class="card-foot">
            <span class="card-name">cta-v1.png</span>
            <span class="verdict rejected">rejected</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="brand">
    <div class="wordmark">
      <div class="mark"></div>
      platter
    </div>
    <div class="tagline">Review mockups · Ship faster</div>
  </div>

  <div class="handle">@platterapp</div>
</div>
</body>
</html>
