<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    background: #F4EFE5;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px;
  }

  /* Vertical rule */
  .rule {
    position: absolute;
    left: 80px;
    top: 80px;
    bottom: 80px;
    width: 2px;
    background: #1B1714;
  }

  .top {
    padding-left: 32px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: #847866;
    margin-bottom: 32px;
  }

  .headline {
    font-family: ui-serif, 'New York', Georgia, serif;
    font-style: italic;
    font-size: 112px;
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: #1B1714;
  }

  .headline em {
    font-style: normal;
    color: #C9472A;
  }

  .middle {
    padding-left: 32px;
    flex: 1;
    display: flex;
    align-items: center;
  }

  .body-text {
    font-family: ui-serif, 'New York', Georgia, serif;
    font-size: 24px;
    line-height: 1.45;
    color: #4A4138;
    max-width: 560px;
  }

  /* Decision pill row */
  .pills {
    padding-left: 32px;
    display: flex;
    gap: 14px;
    align-items: center;
    margin-top: 40px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .pill-a {
    background: rgba(110,127,88,0.15);
    color: #5C6B4A;
    border: 1px solid rgba(110,127,88,0.30);
  }

  .pill-r {
    background: rgba(160,68,40,0.10);
    color: #A04428;
    border: 1px solid rgba(160,68,40,0.20);
  }

  .pill-n {
    background: rgba(27,23,20,0.06);
    color: #847866;
    border: 1px solid rgba(27,23,20,0.10);
  }

  .bottom {
    padding-left: 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .mark {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #C9472A 0%, #5A2E20 100%);
    border: 1.5px solid #1B1714;
    flex-shrink: 0;
  }

  .wname {
    font-family: ui-serif, 'New York', Georgia, serif;
    font-style: italic;
    font-size: 38px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: #1B1714;
  }

  .handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #B5AB99;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="rule"></div>

  <div class="top">
    <div class="eyebrow">Design review · macOS</div>
    <div class="headline">Your<br>mockups<br>deserve<br><em>better.</em></div>
  </div>

  <div class="middle">
    <div>
      <div class="body-text">Drop a folder. Open any file. Mark it approved or rejected — then share a review link and watch decisions carry back.</div>
      <div class="pills">
        <div class="pill pill-a">✓ approved</div>
        <div class="pill pill-r">✕ rejected</div>
        <div class="pill pill-n">· pending</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="wordmark">
      <div class="mark"></div>
      <div class="wname">platter</div>
    </div>
    <div class="handle">@platterapp</div>
  </div>
</div>
</body>
</html>
