<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="72%">
      <stop offset="0%"  stop-color="#252018"/>
      <stop offset="60%" stop-color="#181410"/>
      <stop offset="100%" stop-color="#0C0A08"/>
    </radialGradient>

    <linearGradient id="tile-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE8DF"/>
    </linearGradient>

    <filter id="tile-shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.30"/>
      <feComposite in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="inner-glow" cx="38%" cy="36%" r="60%">
      <stop offset="0%"  stop-color="#3A2E2A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#inner-glow)" opacity="0.5"/>

  <!-- 2×2 grid — tile 240px, gap 32px, total 512px, origin 256,256 -->

  <!-- Top-left (full brightness) -->
  <rect x="256" y="256" width="240" height="240" rx="20" ry="20"
        fill="url(#tile-tl)" filter="url(#tile-shadow)"/>

  <!-- Top-right (52% opacity) -->
  <rect x="528" y="256" width="240" height="240" rx="20" ry="20"
        fill="white" opacity="0.52" filter="url(#tile-shadow)"/>

  <!-- Bottom-left (52% opacity) -->
  <rect x="256" y="528" width="240" height="240" rx="20" ry="20"
        fill="white" opacity="0.52" filter="url(#tile-shadow)"/>

  <!-- Bottom-right (22% opacity / ghost) -->
  <rect x="528" y="528" width="240" height="240" rx="20" ry="20"
        fill="white" opacity="0.22" filter="url(#tile-shadow)"/>

  <!-- Subtle border highlight -->
  <rect width="1024" height="1024" rx="220" ry="220"
        fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
</svg>
